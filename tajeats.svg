<text x="47" y="38" fill="#a7b7ca" font-size="11" font-weight="600" letter-spacing="1.45">03 / FOOD DELIVERY</text>
<path d="M549 39l15-15M551 24h13v13" fill="none" stroke="#e6b48a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="32" y="86" fill="#f1f6fc" font-size="34" font-weight="700" letter-spacing="-.95">TajEats</text>
<text x="32" y="130" fill="#acbacc" font-size="18.5">From restaurant menus</text>
<text x="32" y="156" fill="#acbacc" font-size="18.5">to food at your door.</text>
