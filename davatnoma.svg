<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" role="img" aria-labelledby="title desc">
<title id="title">Davatnoma</title>
<desc id="desc">Make the invitation part of the celebration. Animated project illustration with a static reduced-motion view.</desc>
<defs><linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1420"/><stop offset=".55" stop-color="#090e16"/><stop offset="1" stop-color="#0e1823"/></linearGradient>
<linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d5b1f4" stop-opacity=".45"/><stop offset=".45" stop-color="#334355" stop-opacity=".6"/><stop offset="1" stop-color="#d5b1f4" stop-opacity=".2"/></linearGradient>
<radialGradient id="bloom"><stop stop-color="#d5b1f4" stop-opacity=".2"/><stop offset="1" stop-color="#d5b1f4" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#30203d"/><stop offset="1" stop-color="#0b1521"/></linearGradient>
<linearGradient id="bag" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#684030"/><stop offset="1" stop-color="#281f24"/></linearGradient>
<radialGradient id="plate"><stop stop-color="#263a2c"/><stop offset=".73" stop-color="#15261f"/><stop offset=".87" stop-color="#516046"/><stop offset="1" stop-color="#17251d"/></radialGradient>
<linearGradient id="paper" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#524362"/><stop offset="1" stop-color="#211c34"/></linearGradient>
<linearGradient id="envelope" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#594469"/><stop offset="1" stop-color="#29203c"/></linearGradient>
<linearGradient id="scan-light" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d5b1f4" stop-opacity="0"/><stop offset="1" stop-color="#d5b1f4" stop-opacity=".7"/></linearGradient>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#d5b1f4" opacity=".17"/></pattern>
<clipPath id="card-clip"><rect x="1" y="1" width="598" height="268" rx="21"/></clipPath>
<clipPath id="scan-clip"><rect x="25" y="42" width="182" height="82" rx="3"/></clipPath>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.float{animation:float 7s ease-in-out infinite}
.float-alt{animation:float-alt 9s ease-in-out infinite}
.breathe{animation:breathe 8s ease-in-out infinite}
.orbit{transform-origin:0 0;animation:orbit 20s linear infinite}
.orbit-slow{transform-origin:0 0;animation:orbit 30s linear infinite reverse}
.spark{animation:spark 6s ease-in-out infinite}
.spark-late{animation:spark 7.5s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes float-alt{0%,100%{transform:translateY(-3px)}50%{transform:translateY(5px)}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:.9}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes spark{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-10px);opacity:1}}
 .letter-rise{animation:letter-rise 8s ease-in-out infinite}@keyframes letter-rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}} 
@media(prefers-reduced-motion:reduce){*{animation:none!important}.route-beacon{transform:none}}
</style>
<rect x=".8" y=".8" width="598.4" height="268.4" rx="21" fill="url(#background)" stroke="url(#border)" stroke-width="1.6"/>
<g clip-path="url(#card-clip)">
<ellipse class="breathe" cx="500" cy="192" rx="172" ry="141" fill="url(#bloom)"/>
<rect x="352" y="100" width="240" height="156" fill="url(#dots)"/>
<path d="M363 267C428 213 515 250 596 200" fill="none" stroke="#d5b1f4" stroke-opacity=".08" stroke-width="1.2"/>
<path d="M402 268C470 224 549 245 600 220" fill="none" stroke="#d5b1f4" stroke-opacity=".1"/>
<path d="M34 1h85" stroke="#d5b1f4" stroke-opacity=".8" stroke-width="2"/>
<path d="M590 184v50q0 25-25 25h-47" fill="none" stroke="#d5b1f4" stroke-opacity=".18"/>
<g transform="translate(349 101)">
<ellipse cx="119" cy="147" rx="81" ry="12" fill="#000" opacity=".28"/>
<g class="float-alt"><path d="M43 67l77-49 77 49v78H43z" fill="#30223d" stroke="#d5b1f4" stroke-opacity=".5" stroke-linejoin="round"/>
<path d="M43 67l77 52 77-52" fill="#151c2c" stroke="#5e496e" stroke-width="1.2"/></g>
<g class="letter-rise"><g transform="rotate(-6 119 67)"><rect x="73" y="13" width="95" height="111" rx="8" fill="#070b15" opacity=".25" transform="translate(2 4)"/>
<rect x="73" y="13" width="95" height="111" rx="8" fill="url(#paper)" stroke="#e1bff3" stroke-opacity=".65"/>
<path d="M85 28h70M85 109h70" stroke="#d5b1f4" stroke-opacity=".25"/>
<path d="M116 47c-9-10-20 1 4 17 24-16 13-27 4-17l-4 5z" fill="#be91d0" fill-opacity=".6"/>
<text x="120" y="85" text-anchor="middle" font-size="10" fill="#efe1fa" letter-spacing=".5">You're invited</text>
<path d="M99 96h42" stroke="#c1a5d6" stroke-opacity=".6" stroke-width="1.4" stroke-linecap="round"/>
</g></g>
<g class="float-alt"><path d="M43 67l77 52 77-52v78H43z" fill="url(#envelope)" stroke="#d5b1f4" stroke-opacity=".7" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M43 145l55-43M197 145l-55-43" fill="none" stroke="#d9b5e7" stroke-opacity=".27"/>
<circle cx="120" cy="118" r="12" fill="#a682b3"/><circle cx="120" cy="118" r="9" fill="none" stroke="#ddc5e5" stroke-opacity=".5"/>
<path d="M116 118l3 3 5-6" fill="none" stroke="#faedff" stroke-width="1.5" stroke-linecap="round"/>
</g>
<path class="spark" d="M25 37l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#d5b1f4" fill-opacity=".65"/>
<path class="spark-late" d="M208 82l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#c9f2e8" fill-opacity=".7"/>
<circle class="spark" cx="193" cy="14" r="3" fill="#e4baec"/>
<path class="spark-late" d="M45 105l-4 6M210 36l5 5" stroke="#d5b1f4" stroke-width="2" stroke-linecap="round"/>
</g>
</g>
<circle cx="35" cy="34" r="3" fill="#d5b1f4"/>
<text x="47" y="38" fill="#a7b7ca" font-size="11" font-weight="600" letter-spacing="1.45">05 / DIGITAL INVITATIONS</text>
<path d="M549 39l15-15M551 24h13v13" fill="none" stroke="#d5b1f4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="32" y="86" fill="#f1f6fc" font-size="34" font-weight="700" letter-spacing="-.95">Davatnoma</text>
<text x="32" y="130" fill="#acbacc" font-size="18.5">Make the invitation</text>
<text x="32" y="156" fill="#acbacc" font-size="18.5">part of the celebration.</text>
<path d="M32 212h31" stroke="#d5b1f4" stroke-width="1.5" stroke-opacity=".65"/>
<text x="32" y="235" fill="#d5b1f4" font-size="11" font-weight="600" letter-spacing="1.6">EXPLORE PROJECT</text>
</svg>
