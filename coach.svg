<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" role="img" aria-labelledby="title desc">
<title id="title">Exam Coach</title>
<desc id="desc">Practice with purpose. Prepare for AP1 &amp; AP2. Animated project illustration with a static reduced-motion view.</desc>
<defs><linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1420"/><stop offset=".55" stop-color="#090e16"/><stop offset="1" stop-color="#0e1823"/></linearGradient>
<linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#89f2c1" stop-opacity=".45"/><stop offset=".45" stop-color="#334355" stop-opacity=".6"/><stop offset="1" stop-color="#89f2c1" stop-opacity=".2"/></linearGradient>
<radialGradient id="bloom"><stop stop-color="#89f2c1" stop-opacity=".2"/><stop offset="1" stop-color="#89f2c1" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#123b30"/><stop offset="1" stop-color="#0b1521"/></linearGradient>
<linearGradient id="bag" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#684030"/><stop offset="1" stop-color="#281f24"/></linearGradient>
<radialGradient id="plate"><stop stop-color="#263a2c"/><stop offset=".73" stop-color="#15261f"/><stop offset=".87" stop-color="#516046"/><stop offset="1" stop-color="#17251d"/></radialGradient>
<linearGradient id="paper" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#524362"/><stop offset="1" stop-color="#211c34"/></linearGradient>
<linearGradient id="envelope" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#594469"/><stop offset="1" stop-color="#29203c"/></linearGradient>
<linearGradient id="scan-light" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#89f2c1" stop-opacity="0"/><stop offset="1" stop-color="#89f2c1" stop-opacity=".7"/></linearGradient>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#89f2c1" opacity=".17"/></pattern>
<clipPath id="card-clip"><rect x="1" y="1" width="598" height="268" rx="21"/></clipPath>
<clipPath id="scan-clip"><rect x="25" y="42" width="182" height="82" rx="3"/></clipPath>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.float{animation:float 7s ease-in-out infinite}
.float-alt{animation:float-alt 9s ease-in-out infinite}
.breathe{animation:breathe 8s ease-in-out infinite}
.orbit{transform-origin:0 0;animation:orbit 20s linear infinite}
.orbit-slow{transform-origin:0 0;animation:orbit 30s linear infinite reverse}
.spark{animation:spark 6s ease-in-out infinite}
.spark-late{animation:spark 7.5s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes float-alt{0%,100%{transform:translateY(-3px)}50%{transform:translateY(5px)}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:.9}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes spark{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-10px);opacity:1}}
 .check-one,.check-two,.check-three{stroke-dasharray:15;animation:check 8s ease-in-out infinite}.check-two{animation-delay:.7s}.check-three{animation-delay:1.4s}@keyframes check{0%,15%,100%{stroke-dashoffset:0}35%,45%{stroke-dashoffset:15}65%,90%{stroke-dashoffset:0}}.progress{transform-origin:0 0;animation:progress 8s ease-in-out infinite}@keyframes progress{0%,100%{transform:scaleX(.72)}35%{transform:scaleX(.3)}80%{transform:scaleX(1)}}.scan{animation:scan 6s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateY(0);opacity:.1}50%{transform:translateY(65px);opacity:.35}}.badge{transform-origin:0 0;animation:badge 8s ease-in-out infinite}@keyframes badge{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-7px) rotate(5deg)}} 
@media(prefers-reduced-motion:reduce){*{animation:none!important}.route-beacon{transform:none}}
</style>
