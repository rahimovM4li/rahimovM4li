<g transform="translate(39 129)"><rect class="progress" width="126" height="3" rx="1.5" fill="#89f2c1"/></g>
<g clip-path="url(#scan-clip)"><rect class="scan" opacity=".22" x="25" y="45" width="182" height="22" fill="url(#scan-light)"/></g>
</g>
<g transform="translate(199 130)"><g class="badge"><circle cy="4" r="25" fill="#000" opacity=".25"/><circle r="25" fill="#1a3b31" stroke="#89f2c1" stroke-opacity=".7"/><circle r="18" fill="none" stroke="#98ffcc" stroke-opacity=".3"/><path d="M-9 0l6 6L10-9" fill="none" stroke="#c3ffe2" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<path class="spark-late" d="M13 76v8M9 80h8" stroke="#89f2c1" stroke-width="1.2"/>
</g>
</g>
<circle cx="35" cy="34" r="3" fill="#89f2c1"/>
<text x="47" y="38" fill="#a7b7ca" font-size="11" font-weight="600" letter-spacing="1.45">06 / EXAM PREPARATION</text>
<path d="M549 39l15-15M551 24h13v13" fill="none" stroke="#89f2c1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="32" y="86" fill="#f1f6fc" font-size="34" font-weight="700" letter-spacing="-.95">Exam Coach</text>
<text x="32" y="130" fill="#acbacc" font-size="18.5">Practice with purpose.</text>
<text x="32" y="156" fill="#acbacc" font-size="18.5">Prepare for AP1 &amp; AP2.</text>
<path d="M32 212h31" stroke="#89f2c1" stroke-width="1.5" stroke-opacity=".65"/>
<text x="32" y="235" fill="#89f2c1" font-size="11" font-weight="600" letter-spacing="1.6">EXPLORE PROJECT</text>
</svg>
