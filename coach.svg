<path d="M68 57h96M68 64h64" stroke="#729d8f" stroke-width="2" stroke-linecap="round"/>
<rect x="39" y="77" width="15" height="15" rx="4" fill="#193c32"/><path class="check-two" d="M43 84l3 3 5-7" fill="none" stroke="#b2ffdc" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M68 82h82M68 89h102" stroke="#729d8f" stroke-width="2" stroke-linecap="round"/>
