<ellipse cx="121" cy="88" rx="105" ry="61" fill="none" stroke="#bda8ff" stroke-opacity=".16" stroke-dasharray="2 7"/>
<g transform="translate(119 84)"><g class="orbit"><circle cx="76" cy="0" r="3.2" fill="#bda8ff"/><circle cx="76" cy="0" r="8" fill="#bda8ff" opacity=".1"/></g></g>
<g class="float-alt"><g transform="rotate(-10 105 78)"><rect x="31" y="24" width="145" height="102" rx="12" fill="#161c31" stroke="#bda8ff" stroke-opacity=".3"/><path d="M47 43h54M47 55h31" stroke="#6d6b91" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/></g></g>
<g transform="rotate(8 144 98)"><g class="float-alt"><rect x="72" y="48" width="139" height="99" rx="12" fill="#111a2b" stroke="#36485d"/><path d="M175 68h17M175 78h17" stroke="#466079" stroke-width="2" stroke-linecap="round"/></g></g>
<g class="float"><g transform="rotate(-4 114 88)">
<rect x="38" y="41" width="151" height="102" rx="12" fill="#000" opacity=".25"/>
<rect x="38" y="35" width="151" height="102" rx="12" fill="url(#panel)" stroke="#bda8ff" stroke-opacity=".65"/>
<path d="M51 36h80" stroke="#fff" stroke-opacity=".22"/>
<text x="54" y="78" font-size="31" font-weight="600" fill="#eeeaff">Aa</text>
<path d="M55 94h87M55 104h62" stroke="#7e86a9" stroke-width="2.3" stroke-linecap="round"/>
<rect x="136" y="61" width="34" height="27" rx="6" fill="#bda8ff" fill-opacity=".09" stroke="#bda8ff" stroke-opacity=".18"/>
<path d="M147 73l4 4 9-10" fill="none" stroke="#bda8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M55 122h16M77 122h16M99 122h16" stroke="#bda8ff" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/>
</g></g>
<g transform="translate(194 33)"><g class="spark"><circle r="13" fill="#162b2c" stroke="#8bebc7" stroke-opacity=".7"/><path d="M-5 0l3 3 7-7" fill="none" stroke="#9affd7" stroke-width="1.8" stroke-linecap="round"/></g></g>
<path class="spark-late" d="M18 97v8M14 101h8" stroke="#bda8ff" stroke-opacity=".6" stroke-width="1.4"/>
</g>
</g>
<circle cx="35" cy="34" r="3" fill="#bda8ff"/>
<text x="47" y="38" fill="#a7b7ca" font-size="11" font-weight="600" letter-spacing="1.45">01 / LANGUAGE LEARNING</text>
<path d="M549 39l15-15M551 24h13v13" fill="none" stroke="#bda8ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="32" y="86" fill="#f1f6fc" font-size="34" font-weight="700" letter-spacing="-.95">Kalima</text>
<text x="32" y="130" fill="#acbacc" font-size="18.5">Learn new words.</text>
<text x="32" y="156" fill="#acbacc" font-size="18.5">Remember them longer.</text>
<path d="M32 212h31" stroke="#bda8ff" stroke-width="1.5" stroke-opacity=".65"/>
<text x="32" y="235" fill="#bda8ff" font-size="11" font-weight="600" letter-spacing="1.6">EXPLORE PROJECT</text>
</svg>
