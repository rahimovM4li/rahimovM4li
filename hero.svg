    <path d="M156 40v14" stroke="#4d6579"/>
    <text x="175" y="52" class="mono" font-size="11" letter-spacing="2.4" fill="#a3b7cc">SOFTWARE DEVELOPER</text>
    <text x="59" y="164" font-size="87" font-weight="750" letter-spacing="-4.6" fill="url(#ink)">Muhammadali</text>
    <text x="59" y="257" font-size="94" font-weight="750" letter-spacing="-4.7" fill="url(#ink)">Rahimov<tspan fill="#88ffd1">.</tspan></text>
    <text x="64" y="305" font-size="22.5" letter-spacing="-.3" fill="#b3c4d8">Full-stack development <tspan fill="#63cdb8">·</tspan> AI integration</text>
    <rect x="64" y="337" width="170" height="2" fill="url(#fade)"/>
    <path class="accent-flow" d="M64 338h170" stroke="#c0ffeb" stroke-width="2" stroke-linecap="round"/>
    <text x="64" y="386" class="mono" font-size="12" letter-spacing="1.4" fill="#849db6">FROM IDEA TO WORKING SOFTWARE.</text>
    <g transform="translate(706 12)">

