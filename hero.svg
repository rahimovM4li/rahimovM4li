<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Muhammadali Rahimov — Full-stack development and AI integration</title>
  <desc id="desc">M4LI, a software developer based in Germany. Luminous, gently floating interface, API and data layers are connected by flowing orbital signals. Building with purpose.</desc>

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090f1a"/><stop offset=".6" stop-color="#080c16"/><stop offset="1" stop-color="#100d21"/></linearGradient>
    <radialGradient id="auroraMint"><stop stop-color="#15e8ae" stop-opacity=".52"/><stop offset=".48" stop-color="#0d9e9b" stop-opacity=".2"/><stop offset="1" stop-color="#0d9e9b" stop-opacity="0"/></radialGradient>
    <radialGradient id="auroraViolet"><stop stop-color="#8664ff" stop-opacity=".5"/><stop offset=".5" stop-color="#6747e8" stop-opacity=".18"/><stop offset="1" stop-color="#6747e8" stop-opacity="0"/></radialGradient>
    <radialGradient id="auroraBlue"><stop stop-color="#35bfff" stop-opacity=".24"/><stop offset="1" stop-color="#35bfff" stop-opacity="0"/></radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#d6e4f2"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#baffdf"/><stop offset=".45" stop-color="#65f3cd"/><stop offset="1" stop-color="#4bc4f1"/></linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8fffd4"/><stop offset=".45" stop-color="#48d9f3"/><stop offset="1" stop-color="#b18bff"/></linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#88ffd5" stop-opacity=".8"/><stop offset=".3" stop-color="#70e2fb" stop-opacity=".08"/><stop offset=".7" stop-color="#8f74ff" stop-opacity=".65"/><stop offset="1" stop-color="#8f74ff" stop-opacity=".1"/></linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18313b"/><stop offset=".48" stop-color="#132431"/><stop offset="1" stop-color="#19213d"/></linearGradient>
    <linearGradient id="surfaceMid" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142f3c"/><stop offset=".6" stop-color="#0b1c2e"/><stop offset="1" stop-color="#20253f"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#10232f"/><stop offset=".52" stop-color="#112436"/><stop offset="1" stop-color="#28335d"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#73f6c6"/><stop offset=".5" stop-color="#65d9ff"/><stop offset="1" stop-color="#bd91ff"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#86f8cb" stop-opacity="0"/><stop offset=".3" stop-color="#86f8cb"/><stop offset=".65" stop-color="#72dfff"/><stop offset="1" stop-color="#a68aff" stop-opacity="0"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8affd5" stop-opacity="0"/><stop offset=".8" stop-color="#8affd5" stop-opacity=".07"/><stop offset="1" stop-color="#8affd5" stop-opacity=".4"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="13"/></filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#94adcc" fill-opacity=".15"/></pattern>
    <clipPath id="artClip"><rect width="480" height="438"/></clipPath>
    <style>
      text { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; }
      .mono { font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace; }
      .aura-mint { animation:aurora 13s ease-in-out infinite; }
      .aura-violet { animation:aurora-alt 17s ease-in-out infinite; }
      .layer-ui { animation:lift-ui 7s ease-in-out infinite; }
      .layer-api { animation:lift-api 7s ease-in-out infinite; }
      .layer-data { animation:lift-data 7s ease-in-out infinite; }
      .flow { stroke-dasharray:5 95; animation:flow 7s linear infinite; }
      .flow-slow { stroke-dasharray:2 98; animation:flow 12s linear infinite; }
      .flow-reverse { stroke-dasharray:4 96; animation:flow-reverse 9s linear infinite; }
      .pulse { animation:pulse 5s ease-in-out infinite; }
      .pulse-late { animation:pulse 5s ease-in-out -2.5s infinite; }
      .spark { animation:shimmer 6s ease-in-out infinite; }
      .scan { animation:scan 8s ease-in-out infinite; }
      .accent-flow { stroke-dasharray:24 156; animation:accent-flow 8s linear infinite; }
      @keyframes aurora { 0%,100%{transform:translate(0,0);opacity:.65;}50%{transform:translate(-24px,18px);opacity:1;} }
      @keyframes aurora-alt { 0%,100%{transform:translate(0,0);opacity:.7;}50%{transform:translate(25px,-22px);opacity:1;} }
      @keyframes lift-ui { 0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);} }
      @keyframes lift-api { 0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);} }
      @keyframes lift-data { 0%,100%{transform:translateY(0);}50%{transform:translateY(4px);} }
      @keyframes flow { to { stroke-dashoffset:-200; } }
      @keyframes flow-reverse { to { stroke-dashoffset:200; } }
      @keyframes pulse { 0%,100%{opacity:.35;}50%{opacity:.95;} }
      @keyframes shimmer { 0%,100%{opacity:.35;}50%{opacity:1;} }
      @keyframes scan { 0%,100%{opacity:.18;transform:translateY(0);}50%{opacity:.5;transform:translateY(-13px);} }
      @keyframes accent-flow { to { stroke-dashoffset:-360; } }
      @media(prefers-reduced-motion:reduce) { .aura-mint,.aura-violet,.layer-ui,.layer-api,.layer-data,.flow,.flow-slow,.flow-reverse,.pulse,.pulse-late,.spark,.scan,.accent-flow { animation:none !important; } }
    </style>
    <clipPath id="frame"><rect x=".5" y=".5" width="1199" height="499" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="500" fill="url(#canvas)"/>
